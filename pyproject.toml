[tool.poetry]
name = "poetry-demo"
version = "0.1.0"
description = "Demo project using Poetry"
authors = ["Javier <javier_mtze_dev@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
requests = ">=2.33.1,<3.0.0"
pydantic = ">=2.13.3,<3.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = ">=26.3.1,<27.0.0"
isort = ">=8.0.1,<9.0.0"
ruff = ">=0.15.11,<0.16.0"
pre-commit = ">=4.6.0,<5.0.0"
backoff = ">=2.2.1,<3.0.0"
tenacity = ">=9.1.4,<10.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
